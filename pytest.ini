[pytest]
log_cli = True
log_cli_level = info
log_cli_format = %(asctime)s %(filename)-16s [函数:%(funcName)-15s] [line:%(lineno)-3d] %(levelname)s -- %(message)s
log_cli_date_format = %Y-%m-%d %Y-%m-%d %H:%M:%S

log_file = ./log/test.log
log_file_level = info
log_file_format = %(asctime)s %(filename)-16s [函数:%(funcName)-15s] [line:%(lineno)-3d] %(levelname)s -- %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

addopts = -vs
python_files = test_*.py
python_classes = Test
python_functions = test_*
